[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# NOTE: --timeout=30 below is just a second line of defense against the
# out of memory bug caught earlier in this same branch, where a broken
# mock recv helper caused services.windows_vpn_service._recv_response
# to spin forever on a non-empty return_value. The primary fix was in
# the mock helpers themselves, but please don't drop this timeout (and
# you can probably raise it, but only if you identify any working but
# slow tests), otherwise you run the risk of causing a hang for yourself
# or whoever else decides to work on the test suite later. - Austin
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -ra
    --timeout=30
markers =
    unit: Pure unit tests (no I/O, no network, no subprocess)
    integration: Tests that wire multiple components together
    security: Security-focused tests (input validation, secrets, permissions)
    platform_darwin: macOS-specific tests (skip on other platforms)
    platform_windows: Windows-specific tests (skip on other platforms)
    platform_linux: Linux-specific tests (skip on other platforms)
    slow: Tests that are expected to be slow (downloads, installs)
    network: Tests that require real network access
    real_config_dir: Test the real utils.settings.get_config_dir (skips the conftest settings safety net)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
