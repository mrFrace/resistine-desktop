# Phoenix Desktop CI (Linux). Mirrors the Linux jobs of
# .github/workflows/ci.yml. Having this file also stops GitLab from falling
# back to Auto DevOps, whose Heroku buildpack can't build a desktop app.

stages:
  - check
  - test

default:
  image: python:3.13-bookworm

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  QT_QPA_PLATFORM: offscreen # PyQt6 without a display

cache:
  key:
    files:
      - scripts/requirements/requirements-linux.txt
      - scripts/requirements/requirements-test.txt
  paths:
    - .cache/pip

syntax-check:
  stage: check
  script:
    - python -m compileall -q plugins/ utils/ gui/ main.py

unit-tests:
  stage: test
  needs: [syntax-check]
  before_script:
    # Runtime libraries PyQt6's wheels load on import.
    - apt-get update -qq
    - >
      apt-get install -y -qq --no-install-recommends
      libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -q -r scripts/requirements/requirements-linux.txt
    - pip install -q -r scripts/requirements/requirements-test.txt
  script:
    - >
      python -m pytest tests/unit/ tests/security/ --timeout=30
      -m "not platform_darwin and not platform_windows"
      --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
